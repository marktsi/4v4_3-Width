<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4v4 +3 Width</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a; font-family: 'Barlow', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; color: #fff;
  }

  .header { text-align: center; margin-bottom: 14px; }
  .header h1 {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 22px;
    letter-spacing: 2px; text-transform: uppercase; color: #C61D23;
  }

  .phase-label {
    font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: #fff; background: #C61D23;
    padding: 4px 16px; margin-bottom: 12px; min-width: 290px; text-align: center;
  }

  .scene { position: relative; width: 360px; height: 530px; }

  .field {
    position: absolute; top: 40px; left: 50px; width: 260px; height: 420px;
    background: #1a5c1a; border: 2px solid rgba(255,255,255,0.7); border-radius: 2px;
  }
  .field::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg, transparent, transparent 42px,
      rgba(255,255,255,0.04) 42px, rgba(255,255,255,0.04) 84px);
  }
  .centre-line { position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.5); }
  .centre-circle {
    position: absolute; top: 50%; left: 50%; width: 64px; height: 64px;
    border: 1px solid rgba(255,255,255,0.35); border-radius: 50%; transform: translate(-50%,-50%);
  }
  .centre-dot {
    position: absolute; top: 50%; left: 50%; width: 5px; height: 5px;
    background: rgba(255,255,255,0.45); border-radius: 50%; transform: translate(-50%,-50%);
  }
  .penalty-top, .penalty-bottom {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 116px; height: 58px; border: 1px solid rgba(255,255,255,0.28);
  }
  .penalty-top    { top: 0;    border-top: none; }
  .penalty-bottom { bottom: 0; border-bottom: none; }
  .goal-top, .goal-bottom {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 54px; height: 10px; border: 2px solid rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.07);
  }
  .goal-top    { top: -10px;    border-bottom: none; }
  .goal-bottom { bottom: -10px; border-top: none; }

  /* Dashed zone lines */
  .zone-h { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed rgba(255,255,255,0.55); }
  .zone-v { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed rgba(255,255,255,0.55); }
  .zone-tag {
    position: absolute; font-family: 'Barlow Condensed', sans-serif;
    font-size: 8px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }
  .zone-tag-v { writing-mode: vertical-rl; }

  /* Mini goals sitting on an end line */
  .mini-goal {
    position: absolute; width: 40px; height: 9px;
    border: 2px solid rgba(255,255,255,0.85); background: rgba(255,255,255,0.07);
    transform: translateX(-50%);
  }
  .mini-goal.mg-top    { top: -9px;    border-bottom: none; }
  .mini-goal.mg-bottom { bottom: -9px; border-top: none; }
  /* A goal standing in open play — scored from either side */
  .free-goal {
    position: absolute; width: 44px; height: 11px;
    border: 2px solid rgba(255,255,255,0.9); background: rgba(255,255,255,0.12);
    transform: translate(-50%,-50%);
  }
  /* End zone band */
  .end-zone {
    position: absolute; left: 0; right: 0;
    background: rgba(255,255,255,0.07);
    border-top: 2px dashed rgba(255,255,255,0.5);
  }
  .arc-svg { position: absolute; inset: 0; pointer-events: none; }

  /* Players */
  .player {
    position: absolute; width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 700; color: #fff;
    border: 2px solid rgba(255,255,255,0.3);
    transition: left 0.85s cubic-bezier(0.4,0,0.2,1), top 0.85s cubic-bezier(0.4,0,0.2,1);
    z-index: 10;
  }
  .player.gk {
    border-radius: 5px; font-size: 9px; border-color: rgba(255,255,255,0.65);
  }
  .player.red    { background: #C61D23; box-shadow: 0 0 8px rgba(198,29,35,0.5); }
  .player.blue   { background: #1a6eb5; box-shadow: 0 0 8px rgba(26,110,181,0.5); }
  .player.orange { background: #b86d00; box-shadow: 0 0 8px rgba(184,109,0,0.5); }
  .player.yellow { background: #e0c000; box-shadow: 0 0 8px rgba(224,192,0,0.5); color: #1a1a1a; }

  .player.pulse { animation: pulse 0.45s ease-in-out 4; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.6)} }

  .ball {
    position: absolute; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; border: 1px solid #bbb; z-index: 20;
    transition: left 0.85s cubic-bezier(0.4,0,0.2,1), top 0.85s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 8px rgba(255,255,255,0.9);
  }

  .goal-flash {
    position: absolute; top: 40px; left: 50px; width: 260px; height: 420px;
    background: rgba(198,29,35,0.12); border: 2px solid #C61D23;
    pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 5; border-radius: 2px;
  }
  .goal-flash.show { opacity: 1; }
  .goal-text {
    position: absolute; top: 47%; left: 50%; transform: translate(-50%,-50%);
    font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 900;
    color: #C61D23; letter-spacing: 4px; text-transform: uppercase;
    opacity: 0; transition: opacity 0.3s; z-index: 30;
    text-shadow: 0 0 24px rgba(198,29,35,0.9); pointer-events: none; white-space: nowrap;
  }
  .goal-text.show { opacity: 1; }

  .arrows-svg {
    position: absolute; top: 0; left: 0; width: 360px; height: 530px;
    pointer-events: none; z-index: 15; opacity: 0; transition: opacity 0.4s;
  }
  .arrows-svg.show { opacity: 1; }

  .legend { display: flex; gap: 14px; margin-top: 10px; justify-content: center; flex-wrap: wrap; }
  .legend-item {
    display: flex; align-items: center; gap: 5px; font-size: 11px; color: #bbb;
    font-family: 'Barlow Condensed', sans-serif; letter-spacing: 1px; text-transform: uppercase;
  }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  .legend-dot.red    { background: #C61D23; }
  .legend-dot.blue   { background: #1a6eb5; }
  .legend-dot.orange { background: #b86d00; }
  .legend-dot.yellow { background: #e0c000; }
  .legend-dot.mark   { background: transparent; border: 2px solid rgba(255,255,255,0.8); border-radius: 2px; }

  .step-indicators { display: flex; gap: 7px; margin-top: 10px; }
  .step-dot { width: 7px; height: 7px; border-radius: 50%; background: #333; transition: background 0.3s; }
  .step-dot.active { background: #C61D23; }
  .step-dot.done   { background: #555; }

  .desc {
    font-size: 11px; color: #777; text-align: center; max-width: 310px;
    margin-top: 6px; line-height: 1.5; min-height: 32px;
  }

  .controls { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .btn {
    font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 18px;
    border: none; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary            { background: #C61D23; color: #fff; }
  .btn-primary:hover      { background: #e02228; }
  .btn-secondary          { background: transparent; color: #888; border: 1px solid #333; }
  .btn-secondary:hover    { border-color: #666; color: #ccc; }

  .tsi-logo-wrap{display:flex;justify-content:center;padding:0 0 12px;width:100%;}
  .tsi-logo{height:38px;width:auto;display:block;}
</style>
</head>

<script>
// Scene 360 x 530. Field: left 50, top 40, w 260, h 420.
const FL=50, FT=40, FW=260, FH=420;
function p(px,py){ return [ FL + px/100*FW - 12,  FT + py/100*FH - 12 ]; }
function b(px,py){ return [ FL + px/100*FW - 6.5, FT + py/100*FH - 6.5 ]; }
function ctr(pos){ return [ pos[0]+12, pos[1]+12 ]; }
function shape(pts){ return pts.map(pt => p(pt[0], pt[1])); }

const TEAMS = [{key:'red', colour:'red', count:3}, {key:'blue', colour:'blue', count:3}, {key:'yellow', colour:'yellow', count:3}];
const GKS   = [{colour:'red', x:50, y:6}, {colour:'blue', x:50, y:94}];

const RED_SET = shape([[36,32],[53,35],[62,66]]);
const BLUE_SET = shape([[42,75],[60,75],[64,50]]);
const YELLOW_SET = shape([[6.25,53],[93.75,49],[47,50]]);

// ── Phases ────────────────────────────────────────────────────────────
const phases = [
  {
    desc:"4v4 — a keeper and three outfield players a side — with a neutral in each wide channel and one central.",
    showGoal:false, showTransition:false,
    red:RED_SET,
    blue:BLUE_SET,
    yellow:YELLOW_SET,
    ball:b(53,39)
  },
  {
    desc:"Red 2 plays across to Red 1. Blue 3 slides left along the halfway line into the space Yellow 3 was in, and Yellow 3 drops two steps.",
    showGoal:false, showTransition:true,
    red:RED_SET,
    blue:shape([[42,75],[60,75],[47,50]]),
    yellow:shape([[6.25,53],[93.75,49],[47,57]]),
    ball:b(36,35.6),
    runs:[['blue', p(64,50), p(47,50)]]
  },
  {
    desc:"Red 1 plays wide to Yellow 1, who carries it down the channel. Blue 1 shifts left to the dotted line, and Yellow 1 stops short of Blue 1. Red 1 and Red 2 push up towards halfway; the top keeper steps out to the edge of the box.",
    showGoal:false, showTransition:true,
    red:shape([[36,43],[53,43],[62,66]]),
    blue:shape([[18,75],[60,75],[47,50]]),
    yellow:shape([[6.25,64],[93.75,49],[47,57]]),
    gk:[[50,14],[50,94]],
    ball:b(6.25,67.6),
    runs:[['blue', p(42,75), p(18,75)], ['red', p(36,32), p(36,43)], ['red', p(53,35), p(53,43)]]
  },
  {
    desc:"Red 3 comes diagonally left and down between Blue 1 and Blue 2 to receive from Yellow 1. Yellow 3 runs right and down to stand alongside Blue 2, and Yellow 2 drops two steps.",
    showGoal:false, showTransition:true,
    red:shape([[36,43],[53,43],[43,71]]),
    blue:shape([[18,75],[60,75],[47,50]]),
    yellow:shape([[6.25,64],[93.75,56],[71.5,75]]),
    gk:[[50,14],[50,94]],
    ball:b(37.7,72.4),
    runs:[['red', p(62,66), p(43,71)]]
  },
  {
    desc:"Red 3 slips the pass between Blue 1 and Blue 2, and Yellow 3 runs onto it in behind. Red 1 and Red 2 step up onto the halfway line either side of Blue 3.",
    showGoal:false, showTransition:true,
    red:shape([[35,50],[59,50],[43,71]]),
    blue:shape([[18,75],[60,75],[47,50]]),
    yellow:shape([[6.25,64],[93.75,56],[56,85]]),
    gk:[[50,14],[50,94]],
    ball:b(52,87.6),
    runs:[['red', p(36,43), p(35,50)], ['red', p(53,43), p(59,50)]]
  },
  {
    desc:"Yellow 3 finishes across the keeper into the bottom left corner. The ball went through the wide channel first, so it counts double.",
    showGoal:true, showTransition:false, scoringTeam:['yellow','red'],
    red:shape([[35,50],[59,50],[43,71]]),
    blue:shape([[18,75],[60,75],[47,50]]),
    yellow:shape([[6.25,64],[93.75,56],[56,85]]),
    gk:[[50,14],[50,94]],
    ball:b(42,101)
  }
];

// ── Dashed run arrows — used once the drill has movement ──────────────
function drawRuns(ph){
  for(let i=0;i<8;i++){
    const ba=document.getElementById('ba'+i), ra=document.getElementById('ra'+i);
    if(ba) ba.removeAttribute('d');
    if(ra) ra.removeAttribute('d');
  }
  if(!ph.runs) return;
  const n = { blue:0, red:0 };
  ph.runs.forEach(function(r){
    const el = document.getElementById((r[0]==='red'?'ra':'ba') + (n[r[0]]++));
    if(!el) return;
    const from = ctr(r[1]), to = ctr(r[2]);
    el.setAttribute('d','M'+from[0]+','+from[1]+' L'+to[0]+','+to[1]);
  });
}

// ── Create DOM players ────────────────────────────────────────────────
const scene = document.querySelector('.scene');
const els = { ball:null };
TEAMS.forEach(function(t){ els[t.key]=[]; });

function mkPlayer(colour, label, isGK){
  const el = document.createElement('div');
  el.className = 'player ' + colour + (isGK?' gk':'');
  el.textContent = label;
  scene.appendChild(el);
  return el;
}

function createAll(){
  els.gk = GKS.map(function(g){ return mkPlayer(g.colour, "GK", true); });
  TEAMS.forEach(function(t){
    for(let i=0;i<t.count;i++) els[t.key].push(mkPlayer(t.colour, String(i+1), false));
  });
  const ball = document.createElement('div');
  ball.className = 'ball';
  scene.appendChild(ball);
  els.ball = ball;
}

// ── Render phase ──────────────────────────────────────────────────────
let current=0, isAuto=false, timer=null;

function applyPhase(idx){
  const ph = phases[idx];
  TEAMS.forEach(function(t){
    els[t.key].forEach(function(el,i){
      el.style.left = ph[t.key][i][0]+'px';
      el.style.top  = ph[t.key][i][1]+'px';
    });
  });
  // GKs hold their spot unless a phase gives them one (gk: [[x,y], [x,y]] in field %)
  els.gk.forEach(function(el,i){
    const g = (ph.gk && ph.gk[i]) || [GKS[i].x, GKS[i].y];
    const pos = p(g[0], g[1]);
    el.style.left = pos[0]+"px";
    el.style.top  = pos[1]+"px";
  });
  els.ball.style.left = ph.ball[0]+'px';
  els.ball.style.top  = ph.ball[1]+'px';

  document.getElementById('goalFlash').classList.toggle('show', ph.showGoal);
  document.getElementById('goalText').classList.toggle('show', ph.showGoal);
  if(ph.showGoal && ph.scoringTeam){
    [].concat(ph.scoringTeam).forEach(function(team){
      (els[team]||[]).forEach(function(el){
        el.classList.add("pulse"); setTimeout(function(){el.classList.remove("pulse");},1800);
      });
    });
  }

  drawRuns(ph);
  document.getElementById('svgTransition').classList.toggle('show', ph.showTransition);

  document.getElementById('desc').textContent = ph.desc;
  document.querySelectorAll('.step-dot').forEach(function(d,i){
    d.classList.toggle('active', i===idx);
    d.classList.toggle('done',   i<idx);
  });
  document.getElementById('prevBtn').style.opacity = idx===0 ? '0.3':'1';
  document.getElementById('nextBtn').style.opacity = idx===phases.length-1 ? '0.3':'1';
}

function changePhase(dir){
  const next = Math.max(0, Math.min(phases.length-1, current+dir));
  if(next!==current){ current=next; applyPhase(current); }
  if(current===phases.length-1 && isAuto) stopAuto();
}

function toggleAuto(){
  if(isAuto){ stopAuto(); return; }
  isAuto=true;
  document.getElementById('playBtn').textContent='⏸ Pause';
  if(current===phases.length-1){ current=0; applyPhase(0); }
  timer=setInterval(function(){
    if(current<phases.length-1){ current++; applyPhase(current); }
    else stopAuto();
  }, 2400);
}

function stopAuto(){
  isAuto=false; clearInterval(timer);
  document.getElementById('playBtn').textContent='▶ Auto';
}

phases.forEach(function(){
  const d=document.createElement('div');
  d.className='step-dot';
  document.getElementById('stepDots').appendChild(d);
});

createAll();
applyPhase(0);
</script>
</body>
</html>
